name: "Bao cao tuan (tong hop tuan truoc)"

on:
  schedule:
    - cron: "0 1 * * 1"    # Thứ 2 ~08:00 VN (dự phòng; CF Worker bắn 07:00 VN chính xác)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python report_bot.py weekly
      - name: Lưu state
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "nstt-bot"
            git config user.email "bot@users.noreply.github.com"
            git pull --rebase --autostash || true
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m "update state [skip ci]"
              git push || true
            fi
          fi
