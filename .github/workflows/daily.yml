name: "Báo cáo sáng (1 tin gộp: công việc + ads, số liệu hôm trước)"

on:
  schedule:
    # Mục tiêu gửi ~06:00 sáng VN. GitHub Actions scheduled hay TRỄ vài chục phút→vài giờ
    # nên đặt nhiều mốc; TIN GỘP có dedup theo ngày -> chỉ mốc chạy đầu tiên gửi, mốc sau
    # chỉ gửi lại khi số liệu đổi. (Muốn 06:00 CHÍNH XÁC: dùng cron-job.org gọi workflow_dispatch.)
    - cron: "0 22 * * *"   # 05:00 VN (bù trễ nhẹ -> ~06:00)
    - cron: "0 23 * * *"   # 06:00 VN
    - cron: "0 0 * * *"    # 07:00 VN — chốt nếu 2 mốc trên bị trễ
    - cron: "0 1 * * *"    # 08:00 VN — gửi lại nếu số liệu cập nhật muộn
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python report_bot.py daily
      - name: Lưu state
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "nstt-bot"
            git config user.email "bot@users.noreply.github.com"
            git pull --rebase --autostash || true
            git add state.json
            git commit -m "update state [skip ci]"
            git push
          fi
